# Contract: ores-rate-limit/ores-rl-interfaces@241353d0f5269450690d9646be03db2aba59a2ae
# TJSV validator baseline: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc.
# Existing observe-only/advisory semantics are preserved. This client projection contains no server secret references.
# `.cli-flags.toml` remains flags-2-env's argv/alias/default authority; credential values never belong in CLI flags.
schemaVersion = "ores.rate-limit.config.v1"
layout = "client-only"
defaultPolicyId = "repo-default"

[client]
root = "."
exposePolicyMetadata = true

[[policies]]
policyId = "repo-default"
clientVisible = true
algorithm = "fixed-window"
identityScope = "anonymous-ip"
capacity = 100
windowMs = 60000
refillTokens = 0
refillIntervalMs = 0
requestCost = 1
enforcementMode = "observe-only"
consistencyMode = "advisory"
backendFailureMode = "fail-open"
denyCacheMode = "local-denials"
denyCacheCapacity = 0
maxOvershoot = 0
maxBlockTtlMs = 1000
keyVersion = "v1"
policyVersion = 1
